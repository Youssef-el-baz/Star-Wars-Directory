<div class="min-h-dvh flex flex-col bg-slate-950 text-slate-100">
  <header class="shrink-0 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3">
      <h1 class="text-base font-semibold tracking-tight sm:text-lg">Star Wars Directory</h1>
      <div class="text-xs text-slate-400">SWAPI • Starships</div>
    </div>
  </header>

  <section class="shrink-0 border-b border-slate-800 bg-slate-950">
    <div class="mx-auto max-w-7xl px-4 py-3">
      <label class="block text-xs font-medium text-slate-300" for="search">
        Search by name
      </label>
      <div class="mt-2 flex items-center gap-2">
        <input
          id="search"
          name="search"
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="e.g. Millennium Falcon"
          class="w-full rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:border-slate-500 focus:outline-none"
        />
        <button
          type="button"
          (click)="searchTerm = ''"
          class="shrink-0 rounded-md border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800"
        >
          Clear
        </button>
      </div>
      <p class="mt-2 text-xs text-slate-500">
        Search filters already-loaded rows only (no extra fetch while searching).
      </p>
    </div>
  </section>

  <main class="min-h-0 flex-1">
    <app-starship-grid [searchTerm]="searchTerm" />
  </main>
</div>
